name: Build WordPro Suite Desktop Pro 2.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Validate source
        shell: powershell
        run: .\scripts\validate-source.ps1

      - name: Build single-file professional release
        shell: powershell
        run: .\scripts\build-release.ps1 -Configuration Release

      - name: Validate release package
        shell: powershell
        run: |
          $files = @(
            ".\release\WordProSuite_Setup.exe",
            ".\release\INSTALL_AR.txt",
            ".\release\SHA256_SETUP.txt",
            ".\WordProSuite_Desktop_Pro_V2_2_Windows.zip"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing $file"
            }

            if ((Get-Item $file).Length -lt 32) {
              throw "File is unexpectedly small: $file"
            }
          }

          if ((Get-Item ".\release\WordProSuite_Setup.exe").Length -lt 50000) {
            throw "Setup EXE is too small to contain the embedded add-in."
          }

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: WordProSuite-Desktop-Pro-2.2-Windows
          path: |
            release/**
            WordProSuite_Desktop_Pro_V2_2_Windows.zip
          if-no-files-found: error
