name: Build WordPro Suite Desktop Pro v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Validate source and licensing boundary
        shell: powershell
        run: .\scripts\validate-source.ps1

      - name: Build professional release
        shell: powershell
        run: .\scripts\build-release.ps1 -Configuration Release

      - name: Validate setup package
        shell: powershell
        run: |
          $files = @(
            ".\release\WordProSuite_Setup.exe",
            ".\release\Payload\WordProSuite.AddIn.dll",
            ".\WordProSuite_Desktop_Pro_V2_Windows.zip"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
            if ((Get-Item $file).Length -lt 1024) { throw "File is unexpectedly small: $file" }
          }

      - name: Upload Windows setup package
        uses: actions/upload-artifact@v4
        with:
          name: WordProSuite-Desktop-Pro-v2-Windows
          path: |
            release/**
            WordProSuite_Desktop_Pro_V2_Windows.zip
          if-no-files-found: error
