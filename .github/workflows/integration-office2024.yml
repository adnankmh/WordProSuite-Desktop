name: Test Ultimate 3.0 on Office 2024

on:
  workflow_dispatch:

jobs:
  office2024:
    runs-on: [self-hosted, windows, office2024]
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Build Ultimate release
        shell: powershell
        run: .\scripts\build-release.ps1 -Configuration Release

      - name: Test Word COM integration
        shell: powershell
        run: .\scripts\test-office2024.ps1

      - name: Upload Office 2024 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordProSuite-Ultimate-3.0-Office2024-logs
          path: |
            release/**
            C:\Users\*\AppData\Local\WordProSuite\Logs\**
          if-no-files-found: warn
